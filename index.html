<!-- ===== EMAIL LOGIN ONLY - Replace Phone Login ===== -->
<div id="login-screen">
  <h2>Welcome to Preli</h2>
  <p>Login with your email</p>

  <input type="email" id="emailInput" placeholder="Enter your email" />
  <br><br>
  <input type="password" id="passwordInput" placeholder="Enter your password" />
  <br><br>

  <button onclick="loginWithEmail()">Login</button>
  <br><br>
  <button onclick="signupWithEmail()">Create New Account</button>
  <p id="loginError" style="color:red"></p>
</div>

<script>
function loginWithEmail() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value.trim();
  if (!email || !password) {
    document.getElementById('loginError').innerText = "Please enter email and password";
    return;
  }
  // If you use Firebase:
  // firebase.auth().signInWithEmailAndPassword(email, password)
  // .then(() => { window.location.href = "home.html"; })
  // .catch(e => { document.getElementById('loginError').innerText = e.message; });

  // If you use local demo login (no Firebase):
  localStorage.setItem('preli_user_email', email);
  alert("Welcome " + email);
  // Hide login, show app
  document.getElementById('login-screen').style.display = 'none';
  if (document.getElementById('app-screen')) {
    document.getElementById('app-screen').style.display = 'block';
  }
}

function signupWithEmail() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value.trim();
  if (!email || !password) {
    document.getElementById('loginError').innerText = "Please enter email and password to create account";
    return;
  }
  // If you use Firebase:
  // firebase.auth().createUserWithEmailAndPassword(email, password)
  // .then(() => { alert("Account created! Now login"); })
  // .catch(e => { document.getElementById('loginError').innerText = e.message; });

  localStorage.setItem('preli_user_email', email);
  alert("Account created for " + email);
}
</script>

<!-- ===== ADD PHONE LATER - For Profile Page ===== -->
<!-- Paste this inside your Profile / Settings page -->
<div id="profile-phone">
  <h3>Add Phone Number (Optional)</h3>
  <input type="tel" id="phoneLater" placeholder="Add phone number later" />
  <button onclick="savePhoneLater()">Save Phone</button>
</div>

<script>
function savePhoneLater() {
  const phone = document.getElementById('phoneLater').value.trim();
  localStorage.setItem('preli_user_phone', phone);
  alert("Phone saved: " + phone);
}
</script>
