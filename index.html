function addStat(){window._bg=BG[0];modal("New status",`<textarea id="a" rows="3" maxlength="700" placeholder="What’s on your mind?"></textarea><div class="sp" style="margin:6px 0">${BG.map(c=>`<i style="background:${c};cursor:pointer" onclick="_bg='${c}';this.parentNode.querySelectorAll('i').forEach(x=>x.style.borderColor='');this.style.borderColor='var(--tx)'"></i>`).join("")}</div>`,async()=>{const t=$("#a").value.trim();if(!t)return false;const{error}=await sb.from("statuses").insert({body:t,bg:window._bg});if(error)return toast("Couldn’t post status");toast("Status posted for 24 hours");loadStatus()},"Post")}
function viewS(u){const l=STS.filter(x=>x.user_id==u);if(!l.length)return;let i=0;const v=$("#stv");const show=()=>{if(i>=l.length){v.style.display="none";return}const x=l[i];v.style.background=x.bg;v.innerHTML=`<div class="pg"><b id="pb"></b></div><div>${E(x.body)}</div><small style="position:absolute;bottom:30px">${u==UID?"Your status":E(pname(u))} · ${tm(x.created_at)}</small>`;v.style.display="flex";if(u!=UID)sb.from("status_views").upsert({status_id:x.id,viewer_id:UID},{onConflict:"status_id,viewer_id",ignoreDuplicates:true}).then(()=>{});setTimeout(()=>{const b=$("#pb");if(b)b.style.width="100%"},30);clearTimeout(viewS.t);viewS.t=setTimeout(()=>{i++;show()},5000)};v.onclick=()=>{clearTimeout(viewS.t);i++;show()};show()}
// ---------- calls (WebRTC)
let pc=null,ls=null,cs=null,pend=[],cTimer,cSec=0;const SIG={};
const sigCh=u=>SIG[u]||(SIG[u]=new Promise(r=>{const ch=sb.channel("user:"+u,{config:{private:true}});ch.subscribe(s=>{if(s=="SUBSCRIBED")r(ch)})}));
async function sig(u,m){const ch=await sigCh(u);ch.send({type:"broadcast",event:"sig",payload:{...m,from:UID}})}
function sigListen(){sb.channel("user:"+UID,{config:{private:true}}).on("broadcast",{event:"sig"},({payload})=>onSig(payload)).subscribe()}
function onSig(p){if(p.t=="offer"){if(cs){sig(p.from,{t:"busy",id:p.id});return}cs={id:p.id,peer:p.from,k:p.k,dir:"in",offer:p.sdp,chat:p.chat};callUI("incoming");beep();return}if(!cs||cs.id!=p.id)return;
if(p.t=="answer"&&pc){pc.setRemoteDescription(p.sdp).then(flush)}else if(p.t=="ice"){if(pc&&pc.remoteDescription)pc.addIceCandidate(p.c).catch(()=>{});else pend.push(p.c)}else if(["end","busy","reject"].includes(p.t))endCall(1,p.t)}
const flush=()=>{pend.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));pend=[]};
async function mkPc(video){ls=await navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:"user"}:false});pc=new RTCPeerConnection({iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]});ls.getTracks().forEach(t=>pc.addTrack(t,ls));pc.ontrack=e=>{$("#rv").srcObject=e.streams[0]};pc.onicecandidate=e=>{if(e.candidate)sig(cs.peer,{t:"ice",id:cs.id,c:e.candidate.toJSON()})};pc.onconnectionstatechange=()=>{if(!pc)return;if(pc.connectionState=="connected")connected();if(["failed","closed"].includes(pc.connectionState)&&cs)endCall(1,"lost")};$("#lv").srcObject=ls}
async function startCall(cid,v){const c=C[cid];if(!c||c.is_group)return;if(cs)return toast("You’re already in a call");if(!window.RTCPeerConnection)return toast("Calls aren’t supported on this browser");cs={id:crypto.randomUUID(),peer:peer(c),k:v?"video":"audio",dir:"out",chat:cid};callUI("calling");
try{await mkPc(v);const o=await pc.createOffer();await pc.setLocalDescription(o);sig(cs.peer,{t:"offer",id:cs.id,k:cs.k,chat:cid,sdp:{type:o.type,sdp:o.sdp}});cs.to=setTimeout(()=>{if(cs&&!cs.on)endCall(0,"noanswer")},45000)}catch(e){toast("Camera or microphone access was blocked");cleanup()}}
async function accept(){try{await mkPc(cs.k=="video");await pc.setRemoteDescription(cs.offer);flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);sig(cs.peer,{t:"answer",id:cs.id,sdp:{type:a.type,sdp:a.sdp}});callUI("connecting")}catch(e){toast("Camera or microphone access was blocked");sig(cs.peer,{t:"reject",id:cs.id});cleanup()}}
function connected(){if(!cs||cs.on)return;cs.on=1;clearTimeout(cs.to);cSec=0;callUI("live");cTimer=setInterval(()=>{cSec++;const x=$("#cst");if(x)x.textContent=fd(cSec)},1000)}
function callUI(st){const el=$("#call");el.style.display="flex";const name=E(pname(cs.peer)),vid=cs.k=="video";const txt={incoming:(vid?"Incoming video call":"Incoming voice call"),calling:"Calling…",connecting:"Connecting…",live:"0:00"}[st];
if(!$("#rv")){el.innerHTML=`<video id="rv" autoplay playsinline></video><video id="lv" autoplay muted playsinline></video><div class="av" id="cav"></div><h2 id="cnm" style="margin:6px;z-index:3"></h2><div id="cst" style="z-index:3"></div><div class="cb" id="ccb"></div>`}
$("#rv").style.opacity=vid&&st=="live"?1:0;$("#lv").style.display=vid&&st!="incoming"?"block":"none";$("#cav").style.display=vid&&st=="live"?"none":"grid";$("#cav").textContent=(pname(cs.peer)[0]||"?").toUpperCase();$("#cnm").textContent=pname(cs.peer);$("#cst").textContent=txt;
$("#ccb").innerHTML=st=="incoming"?`<button class="x" onclick="declineCall()">📵</button><button style="background:#1db954" onclick="accept()">📞</button>`:`<button onclick="tgTrack('audio',this)">🎤</button>${vid?`<button onclick="tgTrack('video',this)">📷</button>`:""}<button class="x" onclick="endCall(0,'end')">📵</button>`}
function tgTrack(k,b){if(!ls)return;ls.getTracks().filter(t=>t.kind==k).forEach(t=>{t.enabled=!t.enabled;b.style.opacity=t.enabled?1:.4})}
function declineCall(){sig(cs.peer,{t:"reject",id:cs.id});cleanup()}
function cleanup(){clearInterval(cTimer);if(cs&&cs.to)clearTimeout(cs.to);if(pc){pc.onconnectionstatechange=null;pc.close()}pc=null;if(ls)ls.getTracks().forEach(t=>t.stop());ls=null;pend=[];cs=null;const el=$("#call");el.style.display="none";el.innerHTML=""}
function endCall(remote,why){if(!cs)return;const c=cs,dur=cSec,was=c.on;if(!remote)sig(c.peer,{t:"end",id:c.id});cleanup();if(c.dir=="out"&&C[c.chat]){const ic=c.k=="video"?"🎥":"📞";send({kind:"text",body:was?`${ic} ${c.k=="video"?"Video":"Voice"} call · ${fd(dur)}`:`${ic} Missed ${c.k=="video"?"video":"voice"} call`},c.chat)}if(why=="busy")toast("They’re on another call");if(why=="reject")toast("Call declined")}

function editMe(){modal("Edit profile",`<input id="a" value="${E(me.name)}" placeholder="Name"><input id="b" value="${E(me.about)}" placeholder="About">`,async()=>{const n=$("#a").value.trim()||me.name,ab=$("#b").value.trim();const{error}=await sb.from("profiles").update({name:n,about:ab}).eq("id",UID);if(error)return toast("Couldn’t save");me.name=n;me.about=ab;P[UID]=me;settings()})}
async function logout(){if(!confirm("Log out of Pizchat?"))return;try{if("serviceWorker"in navigator){const reg=await navigator.serviceWorker.getRegistration(),s=reg&&await reg.pushManager.getSubscription();if(s){await sb.from("push_subscriptions").delete().eq("endpoint",s.endpoint);await s.unsubscribe()}}}catch(e){}await sb.auth.signOut();location.reload()}
const b64u=s=>{const r=atob((s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function enablePush(){try{if(!("serviceWorker"in navigator)||!("PushManager"in window))return toast("Push isn’t supported here. On iPhone, add Pizchat to the Home Screen first.");const perm=await Notification.requestPermission();if(perm!="granted")return toast("Notifications are blocked in your browser settings");const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;const{data:key}=await sb.rpc("vapid_key");let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});const j=s.toJSON();const{error}=await sb.from("push_subscriptions").upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_id:UID},{onConflict:"endpoint"});if(error)throw error;S.push=1;saveS();toast("Push notifications are on");settings()}catch(e){toast("Couldn’t turn on push notifications")}}
